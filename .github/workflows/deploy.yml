name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # sem a variável DOMINIO o site fica em vejaseusite.github.io/FoscoTattoo;
      # com DOMINIO=foscotattoo.com.br (por exemplo) ele vai para a raiz do domínio
      - name: Montar o site
        env:
          DOMINIO: ${{ vars.DOMINIO }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          if [ -n "$DOMINIO" ]; then
            export NEXT_PUBLIC_BASE_PATH="" NEXT_PUBLIC_SITE_URL="https://$DOMINIO"
          else
            export NEXT_PUBLIC_BASE_PATH="/FoscoTattoo" NEXT_PUBLIC_SITE_URL="https://vejaseusite.github.io/FoscoTattoo"
          fi
          npm run build
          touch out/.nojekyll
          if [ -n "$DOMINIO" ]; then echo "$DOMINIO" > out/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4
