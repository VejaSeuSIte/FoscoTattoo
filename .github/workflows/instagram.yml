name: Prévia do Instagram
# Uma vez por dia o robô abre o perfil do estúdio num navegador e atualiza a
# prévia do feed no site (scripts/instagram.cjs). Também roda à mão.
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/instagram.cjs foscotattoo
        env:
          FOSCO_ROBO_CHAVE: ${{ secrets.FOSCO_ROBO_CHAVE }}
